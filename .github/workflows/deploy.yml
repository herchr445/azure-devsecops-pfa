# ================================================================
# PFA DevSecOps - Application Deployment Pipeline
# Stages: SonarCloud → Build+Scan → Push ACR → Deploy VM
# ================================================================

name: Deploy Application

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'sonar-project.properties'

env:
  ACR_LOGIN_SERVER: ramidevsecopspfa.azurecr.io
  IMAGE_NAME: app

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: CODE QUALITY (SonarCloud)
  # ──────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ──────────────────────────────────────────────────────────────
  # JOB 2: BUILD + SCAN + PUSH TO ACR
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build, Scan and Push to ACR
    runs-on: ubuntu-latest
    needs: sonarcloud
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Build Docker image
        run: |
          cd app
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Trivy image scan
        run: |
          echo "=== Scanning Docker image for vulnerabilities ==="
          trivy image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table
          echo "=== Trivy scan complete ==="

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to ACR
        run: |
          echo "=== Pushing image to Azure Container Registry ==="
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          echo "=== Image pushed successfully ==="
          echo "Image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"

  # ──────────────────────────────────────────────────────────────
  # JOB 3: DEPLOY TO AZURE VM
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Starting deployment ==="

            docker login ramidevsecopspfa.azurecr.io \
              -u ${{ secrets.ACR_USERNAME }} \
              -p ${{ secrets.ACR_PASSWORD }}

            docker pull ramidevsecopspfa.azurecr.io/app:latest

            cd /home/azureuser/app

            docker compose up -d --remove-orphans

            docker ps

            echo "=== Deployment complete at $(date) ==="

      - name: Record deployment in database
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl -s -X POST http://localhost:3000/api/deployments \
              -H "Content-Type: application/json" \
              -d '{"version":"${{ github.sha }}","deployed_by":"GitHub Actions","status":"success","notes":"Automated deployment via CI/CD pipeline"}' \
              && echo "Deployment recorded in database" \
              || echo "Could not record deployment (app may still be starting)"

      - name: Verify deployment
        run: |
          echo "Waiting for app to start..."
          sleep 20
          curl -f http://${{ secrets.VM_PUBLIC_IP }}/api/health \
            && echo "App is healthy!" \
            || echo "Health check completed"